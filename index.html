<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnóstico de Plantas 🌿</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f9f5;
      padding: 20px;
    }
    h1 { color: #2f6d2f; }
    #result {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>🌱 Diagnóstico de Planta (Offline)</h1>
  <input type="file" id="imageInput" accept="image/*" />
  <button id="analyzeButton">Analisar</button>
  <div id="result">Carregando...</div>

  <!-- 🔗 Bibliotecas TensorFlow e MobileNet -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.12.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.2.2/dist/mobilenet.min.js"></script>

  <!-- Seu script -->
  <script src="app.js"></script>
</body>
</html>
